spring.application.name=question-service
server.port=8083

# ---------------- Arquitectura Hexagonal: adaptador de persistencia ----------------
# jpa (por defecto) | memory  -> prueba de intercambiabilidad sin tocar el dominio
saberpro.persistence.adapter=${SABERPRO_PERSISTENCE_ADAPTER:jpa}

# ---------------- Validation Service (REST sincrono) ----------------
saberpro.validation-service.url=${VALIDATION_SERVICE_URL:http://localhost:8082}

# ---------------- Base de datos ----------------
# Local: H2 en memoria. En Docker Compose se sobreescribe con PostgreSQL
# mediante SPRING_DATASOURCE_URL / USERNAME / PASSWORD.
spring.datasource.url=jdbc:h2:mem:saberpro;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ---------------- RabbitMQ ----------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
